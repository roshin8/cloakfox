// Cloakfox — AutoConfig preferences
// This file is loaded by local-settings.js via the AutoConfig mechanism.

// ==== Daily-Driver Features ====

// Search and URL bar
pref("browser.urlbar.suggest.searches", true);
pref("browser.urlbar.suggest.history", true);
pref("browser.urlbar.suggest.bookmark", true);
pref("browser.urlbar.suggest.topsites", true);
pref("browser.urlbar.maxRichResults", 10);

// New tab page
pref("browser.newtabpage.enabled", true);
pref("browser.newtabpage.activity-stream.feeds.topsites", true);

// Passwords and forms
pref("signon.rememberSignons", true);
pref("browser.formfill.enable", true);

// Reader mode
pref("reader.parse-on-load.enabled", true);

// Tab management
pref("browser.tabs.warnOnClose", true);
pref("browser.tabs.tabmanager.enabled", true);

// Spell check
pref("layout.spellcheckDefault", 1);

// CSS animations (ensure enabled — Cloakfox may disable)
pref("ui.prefersReducedMotion", 0);

// Extensions
pref("extensions.enabledScopes", 15);
pref("extensions.autoDisableScopes", 0);

// Pin Cloakfox Shield to toolbar by default
defaultPref("browser.uiCustomization.state", '{"placements":{"widget-overflow-fixed-list":[],"unified-extensions-area":[],"nav-bar":["back-button","forward-button","stop-reload-button","urlbar-container","search-container","downloads-button","cloakfox-shield_cloakfox-browser-action","unified-extensions-button"],"toolbar-menubar":["menubar-items"],"TabsToolbar":["tabbrowser-tabs","new-tab-button","alltabs-button"],"PersonalToolbar":["personal-bookmarks"]},"seen":["developer-button","cloakfox-shield_cloakfox-browser-action"],"dirtyAreaCache":["nav-bar"],"currentVersion":20,"newElementCount":0}');

// ==== Privacy Hardening ====

// DO NOT enable resistFingerprinting — conflicts with C++ patches
// RFP makes everyone identical; we want per-container uniqueness
pref("privacy.resistFingerprinting", false);

// Container support (critical — foundation of identity isolation)
pref("privacy.userContext.enabled", true);
pref("privacy.userContext.ui.enabled", true);

// Cookie isolation (dynamic First-Party Isolation)
pref("network.cookie.cookieBehavior", 5);

// Strict referrer policy
pref("network.http.referer.XOriginPolicy", 2);

// Geolocation: enabled at the API level so navigator.geolocation
// exists, BUT the actual coords come from MaskConfig (geolocation:
// latitude / :longitude / :accuracy keys filled in per-persona by
// CloakfoxPersonaData). patches/geolocation-spoofing.patch consumes
// those keys, preserves the native permission prompt, and returns the
// spoofed coords. Sites that need geolocation work; they get a
// plausible US-metro location instead of the user's real one. The
// alternative (geo.enabled=false) hides the API entirely, which
// breaks geo-aware sites AND signals "this user disabled geo."
//
// To turn off entirely: flip this pref via about:config; persona
// coords stay set but Firefox never reaches the C++ hook.
defaultPref("geo.enabled", true);

// No remote debugging
pref("devtools.debugger.remote-enabled", false);

// HackerRank needs device IDs before capture to select a camera. Preserve
// Firefox's upstream compatibility entries and add this specific host.
// Listed sites can see IDs earlier; capture still requires permission.
defaultPref("media.devices.enumerate.legacy.allowlist",
  "slack.com,*.slack.com,riverside.fm,*.riverside.fm,www.hackerrank.com");

// Disable telemetry endpoints
pref("toolkit.telemetry.enabled", false);
pref("toolkit.telemetry.unified", false);
pref("toolkit.telemetry.archive.enabled", false);

// Disable safe browsing lookups (privacy, not security risk for advanced users)
pref("browser.safebrowsing.malware.enabled", false);
pref("browser.safebrowsing.phishing.enabled", false);

// Disable prefetch
pref("network.prefetch-next", false);
pref("network.dns.disablePrefetch", true);

// ==== Website appearance and media-query baseline ====
// Honor Firefox's Website appearance setting: 0 = dark, 1 = light,
// 2 = automatic (browser theme / system). Keep the user's selection on restart.
defaultPref("layout.css.prefers-color-scheme.content-override", 2);
//
// Other LookAndFeel signals don't have a separate content-only pref.
// The extension can override them per-container via the
// lookandfeel-spoofing C++ patch (MaskConfig keys lookAndFeel:*),
// but those affect BOTH UI and content. We intentionally do NOT pin
// them at the pref level so the user's real OS theme still drives UI
// (you'd get a dark-UI dark-theme user experience if your OS is dark).
// Trade-off: real OS accessibility settings leak to web when the
// extension isn't setting the per-container keys.

// ==== Timer precision ====
// Coarse timing defeats high-resolution timing-based fingerprints.
pref("privacy.reduceTimerPrecision", true);
pref("privacy.resistFingerprinting.reduceTimerPrecision.microseconds", 1000);

// ==== Build ID pin ====
// navigator.buildID is the Firefox build timestamp — leaks the exact
// installed version. Pin to a constant (Firefox's own RFP spoof value).
pref("general.buildID.override", "20181001000000");

// ==== Font prefetching / fallback metrics ====
// Default font list leaks OS fonts via CSS fallback detection.
pref("font.system.whitelist", "");  // no system-font bypass

// ==== Misc fingerprint-relevant prefs ====
pref("dom.enable_resource_timing", false);           // hides per-resource timing
pref("dom.enable_user_timing", true);                // harmless, enabled
pref("dom.webaudio.enabled", true);                  // required
pref("media.peerconnection.enabled", true);          // WebRTC patched
pref("media.peerconnection.ice.default_address_only", true);  // no mDNS leak
pref("dom.battery.enabled", false);                  // hide Battery API entirely

// ==== User opt-in dangerous-disable flags ====
// Each defaults to false. The persona generator
// (additions/browser/components/cloakfox/CloakfoxPersonas.sys.mjs)
// reads these to decide whether to emit the corresponding MaskConfig
// key in the per-container cloak_cfg blob. Flip true to trade
// compatibility for stealth on surfaces that have legitimate cross-
// origin uses. UI for these is the about:cloakfox page.
//
//   window_name_disabled
//     window.name reads return "" and writes are ignored. Stronger
//     fingerprint defense, but breaks fpscanner / popup auth flows
//     (window.opener.name pattern) and any iframe that uses
//     window.name to pass state. Bisect-confirmed regression on
//     bot.sannysoft.com when on.
//
//   websocket_disabled
//     WebSocket constructor returns disabled. Breaks any site with
//     realtime chat / live data feeds.
//
//   clipboard_disabled
//     navigator.clipboard.readText / writeText / read / write all
//     fail. Breaks paste-from-image on most sites.
//
//   eme_disabled
//     Encrypted Media Extensions disabled. Breaks DRM-protected
//     video (Netflix, Spotify Web Player, Disney+, Prime Video).
//
//   mediadevices_disabled
//     navigator.mediaDevices.enumerateDevices returns empty.
//     Breaks WebRTC / getUserMedia / camera-mic apps (Meet, Zoom,
//     Discord, OBS Studio Browser source, etc.).
//
//   notification_permission_disabled
//     Notification.permission always returns "default". Sites can't
//     tell if user granted/denied. Most users want real permission
//     state, so off by default.
//
//   storage_persisted_disabled
//     navigator.storage.persisted() resolves false. Apps that
//     legitimately need persistent local storage break.
defaultPref("cloakfox.opt.window_name_disabled", false);
defaultPref("cloakfox.opt.websocket_disabled", false);
defaultPref("cloakfox.opt.clipboard_disabled", false);
defaultPref("cloakfox.opt.eme_disabled", false);
defaultPref("cloakfox.opt.mediadevices_disabled", false);
defaultPref("cloakfox.opt.notification_permission_disabled", false);
defaultPref("cloakfox.opt.storage_persisted_disabled", false);

// Window/tab activity privacy: web content sees focused, visible documents
// and a stable non-fullscreen state. Native browser focus, fullscreen control,
// document lifecycle and security checks retain their real state. Scheduling
// follows foreground policy in background pages and their workers, which can
// increase resource use. Off by default; cloakfox.enabled=false overrides it.
defaultPref("cloakfox.opt.focus_masking", false);

// Clipboard signal privacy: hide trusted copy/cut/paste notifications and
// shortcut chords from web content, and expose paste/cut input as ordinary
// insertion/deletion. Native editing and chrome keep their real behavior.
// Custom editors relying on clipboard handlers may stop working. Text changes
// and ordinary typing remain observable. Off by default; the master overrides.
defaultPref("cloakfox.opt.clipboard_masking", false);

// ==== Math constant perturbation ====
// Default false: don't perturb Math.PI / Math.E / etc. Real browsers
// produce these IEEE 754 spec values bit-exact. Perturbing makes
// Math.PI === 3.141592653589793 return false — itself a fingerprint
// signal saying "anti-fingerprinting is active." Other function noise
// follows the master switch and container seed. Log/pow noise is a separate
// option below because data processing relies on their native results.
//
// Flip true to perturb constants as well, accepting that compatibility cost.
defaultPref("cloakfox.opt.math_constants_noise", false);

// ==== Optional data-processing Math noise ====
// Logarithms and powers stay native by default. Firebase uses these for
// tree sizes and numeric hashes; tiny noise can drop fields or break sync.
// Opt in only when accepting that compatibility cost. Reload pages to apply
// the same installation policy to their window and worker realms.
defaultPref("cloakfox.opt.math_data_noise", false);

// ==== Timer precision posture ====
// Two independent knobs that compose:
//
//   timer_high_precision_jitter (default true):
//     Wraps performance.now to add deterministic per-ms-bucket
//     fractional noise. Underlying 1ms quantization stays —
//     defends Spectre / audio FP — but the JS-visible reading
//     looks high-resolution. Hides the "Tor-style" privacy-browser
//     signal from naive probes.
//
//   timer_quantization_off (default false):
//     Setting true turns OFF Firefox's own privacy.reduceTimerPrecision
//     pref entirely. performance.now returns native sub-microsecond
//     precision. Drops Spectre and audio-fingerprinting timing
//     defenses. Only flip if you specifically want raw precision and
//     accept the trade.
//
// Composition table:
//   high_jitter=true,  quant_off=false  → default. Looks high-res, defends.
//   high_jitter=false, quant_off=false  → visibly Tor-style 1ms quant.
//   high_jitter=*,     quant_off=true   → real precision, no defense.
defaultPref("cloakfox.opt.timer_high_precision_jitter", true);
defaultPref("cloakfox.opt.timer_quantization_off", false);

// ==== Master enable for cpp-first JSWindowActors ====
// All Cloakfox JSWindowActors check this pref at entry and bail when
// false. Default true means out-of-box installs get full fingerprint
// protection in the default container (and any pre-existing user
// containers) without requiring a visit to about:cloakfox first.
// User can flip to false via about:config or the about:cloakfox UI
// to disable all spoofing globally (e.g. for debugging).
defaultPref("cloakfox.enabled", true);

// Cosmetic application branding; independent of the privacy master switch.
// macOS uses a private Firefox.app copy and switches on restart.
defaultPref("cloakfox.appearance.firefox", false);

// Shared viewport buckets, not a frozen browser window. Keep global RFP off:
// Cloakfox's C++ geometry getters independently follow this protected viewport.
defaultPref("privacy.resistFingerprinting.letterboxing", true);
defaultPref("privacy.resistFingerprinting.letterboxing.dimensions", "");

// ==== Timezone spoofing ====
// Firefox has no built-in pref to override timezone (intl.timezone.
// override doesn't exist; verified via grep in modules/libpref/init/
// all.js). The only override path is the C++ window.setTimezone()
// WebIDL setter from patches/timezone-spoofing.patch. CloakfoxTimezone
// JSWindowActor calls it on every DOMDocElementInserted with the per-
// container value (default: UTC). Once called, the C++ TimezoneManager
// persists the value in RoverfoxStorageManager and disables the setter
// for that userContextId — Date / Intl.DateTimeFormat / getTimezoneOffset
// all read from the persisted value.
//
// To set a non-UTC timezone for a container, set
//   cloakfox.container.<ucid>.timezone = "America/New_York"
// (any IANA name). The about:cloakfox UI is the intended writer.

// ==== Per-container persona override ====
// Each container's persona is normally picked deterministically from
// math_seed (mod pool length) so the same seed always yields the same
// MaskConfig values. Power users who want a specific config (e.g.
// "always pin this container to a Win11 1366×768 user") can pin a
// pool index via:
//   cloakfox.container.<ucid>.persona_index = <int>
// CloakfoxPersonas.pickPersona honors the override before falling back
// to the seed-derived pick. -1 / unset = auto. The about:cloakfox UI
// is the intended writer; range is [0, pool_length-1] for the host OS.

// ==== WebRTC address privacy ====
// Cloakfox can discover HTTP-visible addresses through external IP-echo
// services and install page-facing WebRTC address masks. Discovery is now a
// separate opt-in (cloakfox.webrtc.external_ip_discovery), off by default.
// Address rewriting is metadata protection, not VPN routing enforcement.
//
// With cloakfox.webrtc.protect_unready=true (default), native ICE policy is
// relay-only whenever discovery is off or either address-family mask is
// missing. This prevents direct candidate gathering during cold startup.
// Services without TURN support may fail, including IPv4-only installations
// where no IPv6 mask is available. Existing connections retain their policy;
// reload/reconnect to apply a changed policy. The master off switch restores
// native ICE behavior. Disabling this guard permits unmasked direct candidates.
//
// Already-installed address masks are per-process/container snapshots. They
// must not be described as a live VPN kill switch or an anonymity guarantee.

// ==== HTTP/2 fingerprint spoofing (experimental, off by default) ====
// Values: "firefox" (default, no change), "chrome", "safari"
// Controls the three inputs to the Akamai h2fingerprint hash:
//   - SETTINGS frame — which IDs are sent, in what order, with what values
//   - Session WINDOW_UPDATE value after SETTINGS
//   - HPACK pseudo-header order (:method / :authority / :scheme / :path)
// Profile signatures:
//   firefox  SETTINGS=1,2,3?,4,5,9?    WINDOW_UPDATE=mInitialRwin  HPACK=m,p,a,s
//   chrome   SETTINGS=1,2,3,4,6        WINDOW_UPDATE=15663105      HPACK=m,a,s,p
//   safari   SETTINGS=2,3,4            WINDOW_UPDATE=10485760      HPACK=m,s,p,a
// Leave as "firefox" for the default daily-driver experience. Enable
// chrome/safari if you need to bypass Cloudflare / Akamai / PerimeterX
// bot checks that fingerprint HTTP/2. Some sites may behave differently.
// MUST be defaultPref(), not pref(). AutoConfig's pref() in Mozilla
// semantics clobbers user values on every startup — so if the extension
// (or selenium, or an about:config edit) flips this to "chrome", the
// next startup resets it back. defaultPref() only seeds the default,
// which the user value then overrides.
defaultPref("network.http.http2.fingerprint_profile", "firefox");

// ==== HTTP/3 fingerprint spoofing (experimental, off by default) ====
// Parallel to the H2 profile pref above. Integer-valued because static_prefs
// (consumed by the Rust neqo glue) cannot bind to string prefs:
//   0 => firefox (default — original neqo SETTINGS emission)
//   1 => chrome  (Chrome-style SETTINGS frame)
//   2 => safari  (sparse Safari-style SETTINGS frame)
// Takes effect on new HTTP/3 connections (existing connections keep old values).
// Combine with the H2 profile for coherent transport fingerprint.
// defaultPref() — same reason as above, user value must survive restart.
defaultPref("network.http.http3.fingerprint_profile", 0);

// NOTE: cloakfox-shield is a Manifest V2 builtin addon (see
// additions/browser/extensions/cloakfox-shield/manifest.json,
// "manifest_version": 2). It declares no host_permissions and no
// content_scripts — its privileged surface is the experiment API
// plus "tabs"/"contextualIdentities" permissions. The MV3-only
// "extensions.originControls.grantByDefault" pref therefore has no
// effect on it and has been removed rather than kept as a no-op.

// ── OS-appearance leaks ────────────────────────────────────────────────────
// Native system colors (AccentColor, Highlight, ButtonFace, ...) are readable
// from content via getComputedStyle and expose the user's chosen OS accent
// colour — high entropy, stable across containers, and read by CreepJS.
// Verified leaking before this: AccentColor reported rgb(0, 122, 255), the
// macOS default blue. Standins make Gecko serve fixed values instead.
defaultPref("ui.use_standins_for_native_colors", true);

// Global Privacy Control enabled NATIVELY rather than faked in JS. The
// FeatureDetect actor used to pin navigator.globalPrivacyControl = true on the
// page, but the native getter, the WorkerNavigator getter and the Sec-GPC
// request header all stayed off — so a worker (which JSWindowActors cannot
// reach) reported false while the page reported true, and no header was ever
// sent. Driving it from these prefs makes window, worker and header agree.
defaultPref("privacy.globalprivacycontrol.enabled", true);
defaultPref("privacy.globalprivacycontrol.functionality.enabled", true);

// ==== Site media compatibility ====
// HackerRank /pair/ caches a Zoom participant ID which changes on failover.
// Refresh that application ID after reconnecting. No media transport, capture
// permissions or fingerprint values change. Disable then reload to opt out.
defaultPref("cloakfox.compat.hackerrank_media", true);
// Native opt-in screen API compatibility. Reload pages after changing access.
defaultPref("cloakfox.compat.screen_management", false);
defaultPref("cloakfox.compat.screen_management.screen_count", 1);
defaultPref("cloakfox.compat.screen_management.origins", '["https://app.testdome.com"]');

// IP-echo services receive the connection IP. Separate opt-in.
defaultPref("cloakfox.webrtc.external_ip_discovery", false);
// TURN-only ICE while discovery is off or either family mask is missing.
defaultPref("cloakfox.webrtc.protect_unready", true);

// Reject precise/PBO WebGL pixel readback rather than expose native GPU hashes.
// Disable for GPU-compute applications which need exact numeric buffers.
defaultPref("cloakfox.opt.webgl_typed_readback_disabled", true);
// Honor effective browser proxy routes for TURN; never fall back to direct.
defaultPref("cloakfox.webrtc.protect_proxy", true);
