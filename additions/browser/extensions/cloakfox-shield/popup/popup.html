<!DOCTYPE html>
<!-- Cloakfox toolbar popup. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cloakfox</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6Z"/></svg></span>
      <span class="brand-name">Cloakfox</span>
    </div>
    <span id="cfx-status" class="status">—</span>
  </header>

  <section id="tab-info">
    <div class="row">
      <span class="label">Container</span>
      <span id="cfx-container" class="value">—</span>
    </div>
    <div class="row">
      <span class="label">This tab</span>
      <span id="cfx-url" class="value url">—</span>
    </div>
  </section>

  <section id="persona-preview">
    <div class="preview-eyebrow">Active persona <span id="cfx-seed-tag" class="seed-tag"></span></div>
    <div id="cfx-persona-preview" class="preview-body">…</div>
    <button id="cfx-popup-regen" class="btn-primary">Change appearance</button>
    <p>Cookies and website logins are kept. To forget container data, open full settings.</p>
  </section>

  <section id="actions">
    <button id="cfx-open-settings" class="btn-secondary">Open full settings →</button>
  </section>

  <p id="cfx-popup-err" class="err" hidden></p>

  <script src="popup.js"></script>
</body>
</html>
