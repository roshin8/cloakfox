name: Chromium source segment

on:
  workflow_call:
    inputs:
      segment:
        type: number
        required: true
      checkpoint:
        type: string
        default: ''
    outputs:
      artifact-id:
        value: ${{ jobs.segment.outputs.artifact-id }}
      complete:
        value: ${{ jobs.segment.outputs.complete }}

permissions:
  contents: read
  checks: write

jobs:
  segment:
    runs-on: macos-26
    timeout-minutes: 350
    outputs:
      complete: ${{ steps.build.outputs.complete }}
      artifact-id: ${{ steps.sdk.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Compute committed engine input identity
        id: key
        run: python3 scripts/ci/engine_artifact.py key --kind chromium
      - name: Validate CI helpers
        run: python3 -m unittest discover -s tests/ci -v
      - name: Reclaim hosted Mac space and require full build capacity
        run: python3 scripts/ci/prepare_macos.py --output "$RUNNER_TEMP/capacity.json"
      - name: Publish capacity assessment before the long build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-capacity-${{ inputs.segment }}
          path: ${{ runner.temp }}/capacity.json
          if-no-files-found: error
          retention-days: 14
      - name: Install build tools
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          brew install cmake ninja ccache
          ccache --max-size 5G
      - name: Snapshot exact same-run Homebrew build tools
        if: inputs.segment == 1
        run: python3 scripts/ci/chromium_host_tools.py snapshot --directory "$RUNNER_TEMP/host-tools"
      - name: Publish immutable same-run Homebrew build tools
        if: inputs.segment == 1
        uses: actions/upload-artifact@v4
        with:
          name: chromium-host-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-tools/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
      - name: Download exact first-segment Homebrew build tools
        if: inputs.segment > 1
        uses: actions/download-artifact@v4
        with:
          name: chromium-host-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-tools
      - name: Verify and restore exact first-segment Homebrew tool bytes
        if: inputs.segment > 1
        run: python3 scripts/ci/chromium_host_tools.py restore --directory "$RUNNER_TEMP/host-tools"
      - name: Verify real Ninja object reuse across checkpoint handoff
        run: '"$pythonLocation/bin/python3" tests/ci/checkpoint_ninja_fixture.py'
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: chromium-arm64-${{ runner.os }}-${{ hashFiles('engines/chromium/*lock.json', 'engines/chromium/patches/*.patch') }}
          restore-keys: chromium-arm64-${{ runner.os }}-
      - name: Download previous same-run workspace
        if: inputs.checkpoint != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint }}
          path: ${{ runner.temp }}/checkpoint-in
      - name: Build or resume pinned native source framework and SDK
        id: build
        env:
          HAS_CHECKPOINT: ${{ inputs.checkpoint != '' }}
          CHROMIUM_SEGMENT: ${{ inputs.segment }}
          CHROMIUM_TELEMETRY_TOKEN: ${{ github.token }}
        run: |
          export PATH="$pythonLocation/bin:$PATH"
          resume=()
          if [[ "$HAS_CHECKPOINT" == "true" ]]; then
            resume=(--resume "$RUNNER_TEMP/checkpoint-in/workspace.tar.gz")
          fi
          "$pythonLocation/bin/python3" -u scripts/ci/chromium_source.py --root "$RUNNER_TEMP/chromium-build" --jobs 3 --compile-minutes 180 --checkpoint-out "$RUNNER_TEMP/checkpoint-out/workspace.tar.gz" "${resume[@]}"
      - name: Preserve unfinished source and compiled objects for next job
        if: steps.build.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-workspace-${{ inputs.segment }}
          path: ${{ runner.temp }}/checkpoint-out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
      - name: Seal completed SDK and original source provenance
        if: steps.build.outputs.complete == 'true'
        run: |
          cp "$RUNNER_TEMP/checkpoint-out/current-identity.json" "$RUNNER_TEMP/chromium-build/engine-package/host-identity.json"
          python3 scripts/ci/engine_artifact.py seal --kind chromium --directory "$RUNNER_TEMP/chromium-build/engine-package"
      - name: Publish immutable source SDK
        id: sdk
        if: steps.build.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-macos-arm64-${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/chromium-build/engine-package/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve capacity, source provenance and stage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-source-evidence-${{ inputs.segment }}
          path: |
            ${{ runner.temp }}/capacity.json
            ${{ runner.temp }}/host-tools/*.json
            ${{ runner.temp }}/chromium-build/evidence/
            ${{ runner.temp }}/checkpoint-out/*.json
            ${{ runner.temp }}/checkpoint-in/*.json
            ${{ runner.temp }}/checkpoint-out/runner-telemetry*.log
            ${{ runner.temp }}/checkpoint-out/runner-telemetry.jsonl
          if-no-files-found: error
          retention-days: 14
