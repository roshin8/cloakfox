name: Build Cloakfox macOS

on:
  workflow_dispatch:
  push:
    branches: [main, codex/firefox-158-port]
    paths-ignore: ['docs/**', '**/*.md']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  # Keep the original group so this migration queues behind the current build.
  group: browser-build-Build Cloakfox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chromium:
    needs: unit-tests
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/chromium.yml

  build-macos:
    needs: unit-tests
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/gecko-engine.yml

  fingerprint-tests:
    needs: build-macos
    env:
      GECKO_BUILD_SHA: ${{ needs.build-macos.outputs.producer-sha }}
      # WebGPU requires the macOS GPU process; retain the normal sandbox.
      CLOAKFOX_HEADFUL: '1'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned upstream fingerprint library fixtures
        run: python3 scripts/setup-fingerprint-libraries.py

      - name: Install pinned Monaco and Firepad probe fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/monaco-probe-assets" --ignore-scripts --no-audit --no-fund --save-exact \
            monaco-editor@0.18.1 @hackerrank/firepad@0.8.6 esbuild@0.25.12
          echo "MONACO_PROBE_ASSETS=$RUNNER_TEMP/monaco-probe-assets" >> "$GITHUB_ENV"

      - name: Install selenium + geckodriver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/fingerprint/requirements-runtime.txt
          brew install geckodriver

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: cloakfox-macos-arm64
          path: artifact

      - name: Extract app from DMG
        run: |
          set -euo pipefail
          DMG=$(find artifact -name "*.dmg" | head -1)
          echo "DMG: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/cfx-dmg -nobrowse -readonly
          mkdir -p /tmp/cfx-app
          cp -R /tmp/cfx-dmg/Cloakfox.app /tmp/cfx-app/
          hdiutil detach /tmp/cfx-dmg
          xattr -cr /tmp/cfx-app/Cloakfox.app || true
          ls -la /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox

      - name: Download same-build native runtime inputs
        uses: actions/download-artifact@v4
        with:
          name: gecko-native-inputs-macos
          path: ${{ runner.temp }}/gecko-native-inputs

      - name: Verify and restore native runtime inputs
        run: |
          set -euo pipefail
          python3 scripts/ci/gecko_native_inputs.py restore --inputs "$RUNNER_TEMP/gecko-native-inputs" \
            --destination "$RUNNER_TEMP/gecko-native" --commit "$GECKO_BUILD_SHA"
          echo "CLOAKFOX_XPCSHELL=$RUNNER_TEMP/gecko-native/bin/xpcshell" >> "$GITHUB_ENV"
          echo "CANONICAL_CODEC_SOURCE_DIR=$RUNNER_TEMP/gecko-native/firefox-src" >> "$GITHUB_ENV"
          echo "CANONICAL_CODEC_LIB_DIR=/tmp/cfx-app/Cloakfox.app/Contents/MacOS" >> "$GITHUB_ENV"
          echo "CLOAKFOX_CANONICAL_GPU_DIR=/tmp/cfx-app/Cloakfox.app/Contents/Resources/canonical-gpu" >> "$GITHUB_ENV"
          python3 scripts/ci/sign_canonical_gpu.py verify \
            --path /tmp/cfx-app/Cloakfox.app/Contents/Resources/canonical-gpu --commit "$GECKO_BUILD_SHA"

      - name: Build and verify pinned same-run ALPS TLS fixture
        timeout-minutes: 20
        run: |
          set -euo pipefail
          brew install cmake ninja go
          python3 scripts/ci/alps_runtime_fixture.py build --work-dir "$RUNNER_TEMP/alps-fixture" --commit "$GITHUB_SHA"
          python3 scripts/ci/alps_runtime_fixture.py verify --work-dir "$RUNNER_TEMP/alps-fixture" --commit "$GITHUB_SHA"
          test -x "$RUNNER_TEMP/alps-fixture/alps-server"
          echo "ALPS_SERVER=$RUNNER_TEMP/alps-fixture/alps-server" >> "$GITHUB_ENV"

      - name: Record hosted native CGL capability
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/native-cgl-diagnostic"
          system_profiler SPDisplaysDataType > "$RUNNER_TEMP/native-cgl-diagnostic/displays.txt" 2>&1
          clang scripts/ci/native_cgl_diagnostic.c -framework OpenGL -o "$RUNNER_TEMP/native-cgl-diagnostic/probe" > "$RUNNER_TEMP/native-cgl-diagnostic/build.log" 2>&1
          "$RUNNER_TEMP/native-cgl-diagnostic/probe" > "$RUNNER_TEMP/native-cgl-diagnostic/cgl.jsonl" 2>&1

      - name: Required CreepJS and FingerprintJS audit
        id: libraries
        continue-on-error: true
        timeout-minutes: 35
        env:
          CLOAKFOX_BIN: /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox
          REPORT_DIR: ${{ runner.temp }}/gecko-library-audit
        run: python3 -u tests/fingerprint/probe_fingerprint_libraries.py

      - name: Run fingerprint probe suite
        id: probes
        continue-on-error: true
        env:
          CLOAKFOX_BIN: /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox
          PROBE_REPORT_ROOT: ${{ runner.temp }}/gecko-probe-evidence
        run: |
          set -o pipefail
          python tests/fingerprint/run_all.py 2>&1 | tee /tmp/probe-output.txt

      - name: Browser-dependent unit tests
        id: browser_units
        continue-on-error: true
        env:
          CLOAKFOX_BIN: /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox
        run: |
          set -euo pipefail
          # These pytest files need a built binary and ran in NO job before —
          # run_all.py only globs probe_*.py. See the unit-tests job for why
          # is needed.
          python -m pip install -q pytest
          python -m pytest --noconftest -q \
            tests/fingerprint/test_math_constants.py \
            tests/fingerprint/test_sec_ch_ua.py

      - name: Summarise results
        if: always()
        run: |
          {
            echo "## Fingerprint probe suite"
            echo ""
            echo '```'
            sed -n '/^====/,$p' /tmp/probe-output.txt 2>/dev/null | head -60 ||               echo "no probe output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-probe-output
          path: /tmp/probe-output.txt

      - name: Preserve required library and strict probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-gecko-audits-macos
          path: |
            ${{ runner.temp }}/gecko-library-audit/
            tests/fingerprint/reports/probe-suite.json
            ${{ runner.temp }}/gecko-probe-evidence/
            ${{ runner.temp }}/native-cgl-diagnostic/
            ${{ runner.temp }}/alps-fixture/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail if probes regressed
        if: always() && (steps.probes.outcome != 'success' || steps.browser_units.outcome != 'success' || steps.libraries.outcome != 'success')
        run: |
          echo "One or more fingerprint probes failed — see the job summary."
          echo "Probes are the only guard against SILENT spoofing regressions."
          exit 1

  unit-tests:
    uses: ./.github/workflows/checks.yml

  dual-engine-tests:
    needs: [build-macos, chromium]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: |
          python3 -m pip install selenium
          brew install geckodriver
      - uses: actions/download-artifact@v4
        with:
          name: cloakfox-macos-arm64
          path: artifacts/gecko
      - uses: actions/download-artifact@v4
        with:
          name: chromium-macos-arm64-test-apps
          path: artifacts/chromium
      - uses: actions/download-artifact@v4
        with:
          name: chromium-source-evidence
          path: evidence/source
      - name: Verify and extract same-commit browsers
        run: |
          mkdir -p apps evidence/coexistence
          python3 scripts/ci/verify_chromium_artifact.py --archive artifacts/chromium/chromium-apps.tar.gz --evidence evidence/source --destination apps
          hdiutil attach artifacts/gecko/Cloakfox-macos-arm64.dmg -mountpoint /tmp/coexist-gecko -nobrowse -readonly
          cp -R /tmp/coexist-gecko/Cloakfox.app apps/
          hdiutil detach /tmp/coexist-gecko
      - name: Concurrent Gecko 158 and Chromium persona and storage checks
        run: |
          python3 tests/engines/probe_dual_engine_coexistence.py \
            --gecko-binary "$PWD/apps/Cloakfox.app/Contents/MacOS/cloakfox" \
            --chromium-binary "$PWD/apps/patched-client/Release/CloakfoxChromium.app/Contents/MacOS/CloakfoxChromium" \
            --require-persona-config --require-pixel-privacy \
            --report evidence/coexistence/dual-engine.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-engine-runtime-evidence
          path: evidence/coexistence/
          if-no-files-found: error

  release:
    # Gates on the probe suites, not just the builds. A build only proves the
    # thing compiles and packages; the probes are what verify the browser
    # actually spoofs. Shipping a tag with red probes means shipping silently
    # broken fingerprint protection, which is the whole product.
    #
    # This is not hypothetical caution: build-linux was green for months while
    # uploading no artifact at all (a *.tar.bz2 glob against a .tar.xz file),
    # so "the build job passed" has already proven to be a weak release signal
    # here.
    needs: [build-macos, fingerprint-tests, unit-tests, chromium, dual-engine-tests]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate upstream security freshness
        run: python3 scripts/release_security.py

      - name: Download verified macOS package
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: cloakfox-macos-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
