name: Recheck preserved SDK client snapshot (a06a951)
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  client:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Check out CI controller
        uses: actions/checkout@v4
        with:
          path: controller
      - name: Read versioned SDK lock
        id: lock
        working-directory: controller
        run: |
          python3 - <<'PY'
          import json,os
          lock=json.load(open('engines/chromium/sdk-lock.json'))
          assert lock['schema']==1 and lock['repository']=='roshin8/cloakfox'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('client='+lock['clientRevision'],file=output)
          PY
      - name: Check out matching client and tests
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.lock.outputs.client }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify preserved app producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          python3 - <<'PYVERIFY'
          import json,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/roshin8/cloakfox/'+path]))
          run=api('actions/runs/40934950029')
          assert run['status']=='completed' and run['head_sha']=='c2e894fcbe9ef2c6b70fa091d17e7afe0495bf73'
          jobs=api('actions/runs/40934950029/jobs?per_page=100')['jobs']
          assert any(s['name']=='Verify SDK and build matched client plus upstream control' and s['conclusion']=='success' for j in jobs for s in j['steps'])
          for identifier in (12924896904,12925152939):
              a=api(f'actions/artifacts/{identifier}')
              assert not a['expired'] and a['workflow_run']['id']==40934950029 and a['workflow_run']['head_sha']==run['head_sha']
          open('evidence/reused-producer.json','w').write(json.dumps(run,indent=2))
          PYVERIFY
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12924896904'
          run-id: '40934950029'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: source/artifacts/apps
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12925152939'
          run-id: '40934950029'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: source/evidence/original
      - name: Verify and restore preserved clients
        id: clients
        run: |
          python3 ../controller/scripts/ci/reuse_locale_apps.py
      - name: Install runtime probe dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.clients.outcome == 'success' }}
        run: |
          python3 -m pip install -r tests/network/requirements-wire.txt selenium
          brew install geckodriver
          python3 scripts/setup-fingerprint-libraries.py
      - name: Require actual Metal execution
        id: metal
        if: ${{ !cancelled() && steps.clients.outcome == 'success' }}
        run: |
          python3 scripts/ci/runner_probe.py --output evidence/runner.json
          python3 -c 'import json; assert json.load(open("evidence/runner.json"))["metalAvailable"]'
      - name: Require upstream CreepJS and FingerprintJS native audit
        if: ${{ !cancelled() && steps.clients.outcome == 'success' && steps.metal.outcome == 'success' }}
        run: python3 -u tests/engines/probe_fingerprint_libraries.py --binary "$CLOAKFOX_CHROMIUM_BIN" --report-dir evidence/library-audit
      - name: Diagnose original fixture scrollbar against reused apps
        if: ${{ !cancelled() && steps.clients.outcome == 'success' && steps.metal.outcome == 'success' }}
        run: python3 ../controller/scripts/ci/diagnose_scrollbar.py --repo "$PWD" --output evidence/scrollbar
      - name: Test source replays and portable native fixtures
        if: ${{ !cancelled() && steps.clients.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../controller/scripts/ci/prepare_locale_recheck.py
      - name: Require full engine privacy and native client suite
        if: ${{ !cancelled() && steps.clients.outcome == 'success' && steps.metal.outcome == 'success' }}
        env:
          SHUTDOWN_EVIDENCE: evidence/shutdown
          SHUTDOWN_FULL_SUITE: '1'
        run: |
          set -o pipefail
          PYTHONPATH="$PWD" python3 -u ../controller/scripts/ci/diagnose_chromium_shutdown.py 2>&1 | tee evidence/engine-tests.log
      - name: Require sandbox and storage isolation
        if: ${{ !cancelled() && steps.clients.outcome == 'success' }}
        run: python3 tests/engines/probe_cef_isolation.py --binary "$CLOAKFOX_CHROMIUM_BIN" --report evidence/isolation.json
      - name: Require owned TCP QUIC and certificate rejection
        if: ${{ !cancelled() && steps.clients.outcome == 'success' }}
        run: python3 tests/engines/probe_cef_transport.py --binary "$CLOAKFOX_CHROMIUM_BIN" --report evidence/transport.json
      - name: Verify retained Gecko producer and artifacts
        id: gecko_producer
        if: ${{ !cancelled() && steps.clients.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/roshin8/cloakfox/'+path]))
          run=api('actions/runs/39026745900')
          assert run['status']=='completed' and run['head_sha']=='4d3e0c28d41b194832e62bac2dc595811c32abca'
          assert run['head_repository']['full_name']=='roshin8/cloakfox'
          jobs=api('actions/runs/39026745900/jobs?per_page=100')['jobs']
          assert any(j['name'].split(' / ')[-1]=='gecko-engine-complete' and j['conclusion']=='success' for j in jobs)
          artifacts=[]
          for identifier,name in [(12099719951,'cloakfox-macos-arm64'),(12100705023,'gecko-build-provenance')]:
              artifact=api(f'actions/artifacts/{identifier}')
              assert not artifact['expired'] and artifact['name']==name
              assert artifact['workflow_run']['id']==39026745900 and artifact['workflow_run']['head_sha']==run['head_sha']
              artifacts.append(artifact)
          open('evidence/gecko-producer.json','w').write(json.dumps({'run':run,'artifacts':artifacts},indent=2))
          PY
      - name: Download retained Gecko app
        if: ${{ !cancelled() && steps.gecko_producer.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12099719951'
          merge-multiple: true
          run-id: '39026745900'
          github-token: ${{ github.token }}
          path: source/artifacts/gecko
      - name: Download retained Gecko provenance
        if: ${{ !cancelled() && steps.gecko_producer.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12100705023'
          merge-multiple: true
          run-id: '39026745900'
          github-token: ${{ github.token }}
          path: source/evidence/gecko-provenance
      - name: Verify Gecko bytes and require dual-engine coexistence
        if: ${{ !cancelled() && steps.gecko_producer.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util,json,fnmatch,hashlib,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('engine','scripts/ci/engine_artifact.py')
          engine=importlib.util.module_from_spec(spec);spec.loader.exec_module(engine)
          sha='4d3e0c28d41b194832e62bac2dc595811c32abca'
          selected=[]
          for entry in subprocess.check_output(['git','ls-tree','-r','-z',sha]).split(b'\0'):
              if not entry:continue
              path=entry.split(b'\t',1)[1].decode()
              if any(path==pattern or path.startswith(pattern+'/') or fnmatch.fnmatchcase(path,pattern) for pattern in engine.INPUTS['gecko']):selected.append(entry)
          key=hashlib.sha256(b'cloakfox-native-v1/macos-arm64/gecko\0'+b'\0'.join(selected)).hexdigest()
          assert key=='bb2db43ebb0d6004e4cfed8ee8f9231021aa40bf62fc06d1fa0bee7162a40224'
          manifests=list(Path('evidence/gecko-provenance').rglob('engine-artifact.json'));assert len(manifests)==1
          record=json.loads(manifests[0].read_text())
          assert record['schema']==1 and record['platform']=='macos-arm64' and record['kind']=='gecko'
          assert record['key']==key and record['producerSha']==sha and record['producerRun']=='39026745900'
          dmg=Path('artifacts/gecko/Cloakfox-macos-arm64.dmg');assert not dmg.is_symlink()
          assert record['files'][dmg.name]=={'sha256':engine.digest(dmg),'size':dmg.stat().st_size}
          PY
          mkdir -p apps
          hdiutil attach artifacts/gecko/Cloakfox-macos-arm64.dmg -mountpoint "$RUNNER_TEMP/coexist-gecko" -nobrowse -readonly
          cp -R "$RUNNER_TEMP/coexist-gecko/Cloakfox.app" apps/
          hdiutil detach "$RUNNER_TEMP/coexist-gecko"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' apps/Cloakfox.app/Contents/Info.plist)" = org.mozilla.cloakfox
          python3 tests/engines/probe_dual_engine_coexistence.py --gecko-binary "$PWD/apps/Cloakfox.app/Contents/MacOS/cloakfox" --chromium-binary "$CLOAKFOX_CHROMIUM_BIN" --require-persona-config --require-pixel-privacy --report evidence/coexistence.json
      - name: Preserve provenance and every gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-sdk-recheck-evidence
          path: source/evidence/
          if-no-files-found: error
          retention-days: 30
