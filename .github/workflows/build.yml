name: Build Cloakfox

on:
  workflow_dispatch:
  push:
    branches: [main, codex/firefox-158-port]
    paths-ignore: ['docs/**', '**/*.md']
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-build-${{ github.workflow }}-${{ github.ref }}
  # Preserve healthy full-source compilation when another platform needs a fix.
  # Keep at most the newest pending run behind the current one.
  cancel-in-progress: false

jobs:
  chromium:
    uses: ./.github/workflows/chromium.yml

  build-macos:
    runs-on: macos-26
    env:
      SCCACHE_GHA_ENABLED: "true"
      BUILD_TARGET: macos,arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | bash -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          brew install aria2 nasm lld create-dmg
          cargo install cbindgen --version 0.29.4 --locked
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.9

      - name: Prioritize action's sccache
        run: echo "$(dirname $SCCACHE_PATH)" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build extension
        run: make extension

      - name: Generate Assets.car
        run: bash scripts/generate-assets-car.sh

      - name: Fetch and setup
        run: |
          make fetch
          make setup-minimal

      - name: Patch and configure
        run: |
          make dir
          python3 scripts/fix-mach-logging.py firefox-src
          echo "ac_add_options --with-ccache=$SCCACHE_PATH" >> firefox-src/mozconfig

      - name: Source-dependent Gecko regression tests
        run: |
          set -euo pipefail
          for f in tests/fingerprint/test_*.mjs; do
            if grep -q 'firefox-src' "$f"; then
              node --test "$f"
            fi
          done
          python3 -m unittest discover -s tests/release -p 'test_*.py'
          test -f firefox-src/netwerk/protocol/http/nsHttpConnectionInfo.cpp
          python3 -m unittest discover -s tests/network -p 'test_native_network_snapshot.py'

      - name: Build
        env:
          # Route rustc through sccache (mk_add_options in mozconfig
          # didn't propagate). Step-level env reaches mach/cargo/rustc.
          RUSTC_WRAPPER: ${{ env.SCCACHE_PATH }}
          SCCACHE_GHA_ENABLED: "true"
          # Prevent the sccache daemon from idling out on macOS. On
          # recent runs the daemon shut down mid-build with
          # 'server looks like it shut down unexpectedly, compiling
          # locally instead' — after which every compile bypasses
          # the cache. SCCACHE_IDLE_TIMEOUT=0 disables the 600s-default
          # idle timer. Also enable error logging so the next crash
          # (if any) is diagnosable.
          SCCACHE_IDLE_TIMEOUT: "0"
          SCCACHE_ERROR_LOG: /tmp/sccache.log
          SCCACHE_LOG: warn
        run: make build

      - name: Dump sccache error log
        if: always()
        run: cat /tmp/sccache.log || true

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Verify
        run: |
          ls -la firefox-src/obj-*/dist/bin/cloakfox* || true
          grep "setCanvasSeed" firefox-src/dom/webidl/Window.webidl && echo "C++ API: FOUND" || echo "C++ API: NOT FOUND"

      - name: Package
        run: |
          cd firefox-src && ./mach package
          # Extract app from mach package DMG
          DMG_PATH=$(find obj-*/dist -name "*.dmg" -maxdepth 1 | head -1)
          hdiutil attach "$DMG_PATH" -mountpoint /tmp/mach-dmg -nobrowse
          # Copy app, strip extended attributes, and ad-hoc codesign
          mkdir -p /tmp/dmg-staging
          cp -R /tmp/mach-dmg/Cloakfox.app /tmp/dmg-staging/
          xattr -cr /tmp/dmg-staging/Cloakfox.app
          codesign --force --deep --sign - /tmp/dmg-staging/Cloakfox.app
          hdiutil detach /tmp/mach-dmg
          # Create branded DMG with background, icon positioning, and Applications shortcut
          mkdir -p ../dist
          create-dmg \
            --volname "Cloakfox" \
            --volicon "../additions/browser/branding/cloakfox/firefox.icns" \
            --background "../additions/browser/branding/cloakfox/background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --text-size 12 \
            --icon "Cloakfox.app" 175 200 \
            --app-drop-link 485 200 \
            --hide-extension "Cloakfox.app" \
            --no-internet-enable \
            --format UDZO \
            ../dist/Cloakfox-macos-arm64.dmg \
            /tmp/dmg-staging

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloakfox-macos-arm64
          path: dist/Cloakfox-macos-arm64.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      BUILD_TARGET: linux,x86_64
      CC: clang-19
      CXX: clang++-19
      HOST_CC: clang-19
      HOST_CXX: clang++-19

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up LLVM 19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19 clang-19
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-19 100

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | bash -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools p7zip-full aria2 nasm \
            libasound2-dev libgtk-3-dev libdbus-glib-1-dev libpulse-dev \
            libx11-xcb-dev libxt-dev libxrandr-dev libxcomposite-dev libxdamage-dev \
            libclang-19-dev
          cargo install cbindgen --version 0.29.4 --locked

      - name: Set up git identity
        run: |
          git config --global user.email "ci@cloakfox"
          git config --global user.name "Cloakfox CI"

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.9

      - name: Prioritize action's sccache
        run: echo "$(dirname $SCCACHE_PATH)" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build extension
        run: make extension

      - name: Fetch and setup
        run: |
          make fetch
          make setup-minimal

      - name: Patch and configure
        run: |
          make dir
          python3 scripts/fix-mach-logging.py firefox-src
          echo "ac_add_options --with-ccache=$SCCACHE_PATH" >> firefox-src/mozconfig

      - name: Create swap space
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Source-dependent Gecko regression tests
        run: |
          set -euo pipefail
          for f in tests/fingerprint/test_*.mjs; do
            if grep -q 'firefox-src' "$f"; then
              node --test "$f"
            fi
          done
          python3 -m unittest discover -s tests/release -p 'test_*.py'
          test -f firefox-src/netwerk/protocol/http/nsHttpConnectionInfo.cpp
          python3 -m unittest discover -s tests/network -p 'test_native_network_snapshot.py'

      - name: Build
        env:
          # Route rustc through sccache (mk_add_options in mozconfig
          # didn't propagate). Step-level env reaches mach/cargo/rustc.
          RUSTC_WRAPPER: ${{ env.SCCACHE_PATH }}
          SCCACHE_GHA_ENABLED: "true"
          # Prevent the sccache daemon from idling out on macOS. On
          # recent runs the daemon shut down mid-build with
          # 'server looks like it shut down unexpectedly, compiling
          # locally instead' — after which every compile bypasses
          # the cache. SCCACHE_IDLE_TIMEOUT=0 disables the 600s-default
          # idle timer. Also enable error logging so the next crash
          # (if any) is diagnosable.
          SCCACHE_IDLE_TIMEOUT: "0"
          SCCACHE_ERROR_LOG: /tmp/sccache.log
          SCCACHE_LOG: warn
        run: make build

      - name: Dump sccache error log
        if: always()
        run: cat /tmp/sccache.log || true

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Verify
        run: |
          ls -la firefox-src/obj-*/dist/bin/cloakfox* || true
          grep "setCanvasSeed" firefox-src/dom/webidl/Window.webidl && echo "C++ API: FOUND" || echo "C++ API: NOT FOUND"

      - name: Package
        run: cd firefox-src && ./mach package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloakfox-linux-x86_64
          # mach package produces .tar.xz on Firefox 146; the old *.tar.bz2 glob
          # matched nothing, so this artifact was NEVER uploaded — the step
          # logged "No files were found" and still reported success. Nothing
          # consumed it until the Linux probe job, which is what exposed it.
          path: firefox-src/obj-*/dist/*.tar.xz
          # Never silently upload nothing again.
          if-no-files-found: error

  # Runtime probes and browser-dependent unit failures both block the job.
  # Without this nothing exercises tests/fingerprint/ automatically, and the
  # regressions it guards are SILENT by nature — a dead cloak_cfg key, an
  # unseeded jitter or a mismatched key name changes no visible behaviour, so a
  # human would not notice one. Capture both suites before the final hard gate.
  fingerprint-tests:
    needs: build-macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned upstream fingerprint library fixtures
        run: python3 scripts/setup-fingerprint-libraries.py

      - name: Install pinned Monaco and Firepad probe fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/monaco-probe-assets" --ignore-scripts --no-audit --no-fund --save-exact \
            monaco-editor@0.18.1 @hackerrank/firepad@0.8.6 esbuild@0.25.12
          echo "MONACO_PROBE_ASSETS=$RUNNER_TEMP/monaco-probe-assets" >> "$GITHUB_ENV"

      - name: Install selenium + geckodriver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/fingerprint/requirements-runtime.txt
          brew install geckodriver

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: cloakfox-macos-arm64
          path: artifact

      - name: Extract app from DMG
        run: |
          set -euo pipefail
          DMG=$(find artifact -name "*.dmg" | head -1)
          echo "DMG: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/cfx-dmg -nobrowse -readonly
          mkdir -p /tmp/cfx-app
          cp -R /tmp/cfx-dmg/Cloakfox.app /tmp/cfx-app/
          hdiutil detach /tmp/cfx-dmg
          xattr -cr /tmp/cfx-app/Cloakfox.app || true
          ls -la /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox

      - name: Required CreepJS and FingerprintJS audit
        id: libraries
        continue-on-error: true
        timeout-minutes: 35
        env:
          CLOAKFOX_BIN: /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox
          REPORT_DIR: ${{ runner.temp }}/gecko-library-audit
        run: python3 -u tests/fingerprint/probe_fingerprint_libraries.py

      - name: Run fingerprint probe suite
        id: probes
        continue-on-error: true
        env:
          CLOAKFOX_BIN: /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox
        run: |
          set -o pipefail
          python tests/fingerprint/run_all.py 2>&1 | tee /tmp/probe-output.txt

      - name: Browser-dependent unit tests
        id: browser_units
        continue-on-error: true
        env:
          CLOAKFOX_BIN: /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox
        run: |
          set -euo pipefail
          # These pytest files need a built binary and ran in NO job before —
          # run_all.py only globs probe_*.py. See the unit-tests job for why
          # is needed.
          python -m pip install -q pytest
          python -m pytest --noconftest -q \
            tests/fingerprint/test_math_constants.py \
            tests/fingerprint/test_sec_ch_ua.py

      - name: Summarise results
        if: always()
        run: |
          {
            echo "## Fingerprint probe suite"
            echo ""
            echo '```'
            sed -n '/^====/,$p' /tmp/probe-output.txt 2>/dev/null | head -60 ||               echo "no probe output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-probe-output
          path: /tmp/probe-output.txt

      - name: Preserve required library and strict probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-gecko-audits-macos
          path: |
            ${{ runner.temp }}/gecko-library-audit/
            tests/fingerprint/reports/probe-suite.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail if probes regressed
        if: always() && (steps.probes.outcome != 'success' || steps.browser_units.outcome != 'success' || steps.libraries.outcome != 'success')
        run: |
          echo "One or more fingerprint probes failed — see the job summary."
          echo "Probes are the only guard against SILENT spoofing regressions."
          exit 1

  # Same probe suite, run against the LINUX build.
  #
  # Every fingerprint result in this project has been validated on macOS only —
  # one Apple Silicon dev box plus a macOS runner. That is a weak base for a
  # browser whose whole job is host-independence: several bugs found so far were
  # host-dependent, and personas sample an OS from the seed rather than locking
  # to the host, so a macOS host silently exercises the "persona matches host"
  # path a third of the time and the mismatch path the rest. On Linux the same
  # personas land differently, the font stack is different, and any assertion
  # that quietly assumed a Mac shows up here.
  #
  # continue-on-error on the suite step (not the job) so a Linux-only failure is
  # reported with full output rather than aborting mid-run.
  fingerprint-tests-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned upstream fingerprint library fixtures
        run: python3 scripts/setup-fingerprint-libraries.py

      - name: Install pinned Monaco and Firepad probe fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/monaco-probe-assets" --ignore-scripts --no-audit --no-fund --save-exact \
            monaco-editor@0.18.1 @hackerrank/firepad@0.8.6 esbuild@0.25.12
          echo "MONACO_PROBE_ASSETS=$RUNNER_TEMP/monaco-probe-assets" >> "$GITHUB_ENV"

      - name: Install selenium + geckodriver
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tests/fingerprint/requirements-runtime.txt
          # Pinned URL rather than a package manager: apt has no geckodriver and
          # snap is unavailable on the runner. The probes pass the system-access
          # flag as a geckodriver service arg, which works on 0.36 and 0.37 alike,
          # so this version can move without breaking them.
          curl -sL -o /tmp/gd.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
          sudo tar -xzf /tmp/gd.tar.gz -C /usr/local/bin
          geckodriver --version

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0 libdbus-glib-1-2 libasound2t64 || \
            sudo apt-get install -y xvfb xauth libgtk-3-0 libdbus-glib-1-2 libasound2

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: cloakfox-linux-x86_64
          path: artifact

      - name: Extract build
        run: |
          set -euo pipefail
          TARBALL=$(find artifact \( -name "*.tar.xz" -o -name "*.tar.bz2" \) | head -1)
          echo "tarball: $TARBALL"
          test -n "$TARBALL"
          mkdir -p /tmp/cfx-linux
          case "$TARBALL" in
            *.tar.xz)  tar -xJf "$TARBALL" -C /tmp/cfx-linux ;;
            *.tar.bz2) tar -xjf "$TARBALL" -C /tmp/cfx-linux ;;
          esac
          BIN=$(find /tmp/cfx-linux -maxdepth 3 -type f -name "cloakfox" | head -1)
          echo "binary: $BIN"
          test -n "$BIN"
          echo "CLOAKFOX_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Required CreepJS and FingerprintJS audit
        id: libraries
        continue-on-error: true
        timeout-minutes: 35
        env:
          REPORT_DIR: ${{ runner.temp }}/gecko-library-audit
        run: xvfb-run -a python3 -u tests/fingerprint/probe_fingerprint_libraries.py

      - name: Run fingerprint probe suite
        id: probes
        continue-on-error: true
        run: |
          set -o pipefail
          python tests/fingerprint/run_all.py 2>&1 | tee /tmp/probe-output-linux.txt

      - name: Browser-dependent unit tests
        id: browser_units
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest --noconftest -q \
            tests/fingerprint/test_math_constants.py \
            tests/fingerprint/test_sec_ch_ua.py

      - name: Summarise results
        if: always()
        run: |
          {
            echo "## Fingerprint probe suite (Linux)"
            echo ""
            echo '```'
            sed -n '/^====/,$p' /tmp/probe-output-linux.txt 2>/dev/null | head -60 || \
              echo "no probe output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-probe-output-linux
          path: /tmp/probe-output-linux.txt

      - name: Preserve required library and strict probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-gecko-audits-linux
          path: |
            ${{ runner.temp }}/gecko-library-audit/
            tests/fingerprint/reports/probe-suite.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail if probes regressed
        if: always() && (steps.probes.outcome != 'success' || steps.browser_units.outcome != 'success' || steps.libraries.outcome != 'success')
        run: |
          echo "One or more fingerprint probes failed on LINUX."
          echo "A Linux-only failure usually means an assertion assumed a macOS host."
          exit 1

  # Pure unit tests — no browser, no build. Runs in about a minute.
  #
  # These existed and were run by hand; nothing in CI executed them, so they
  # guarded nothing. They cover logic that is expensive to reach through a
  # built browser (matchMedia query evaluation, SeedSync font handling, Math
  # constant policy, Sec-CH-UA, probe scoring) and they catch regressions long
  # before a 2-hour build would.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install unit and transport fixture dependencies
        run: python3 -m pip install pytest -r tests/network/requirements-wire.txt

      - name: Engine and CI helper unit tests (native runtime runs separately)
        run: |
          python3 -m unittest discover -s tests/ci -v
          python3 -m unittest discover -s tests/engines -p 'test_*.py' -v

      - name: Node unit tests
        run: |
          set -euo pipefail
          for f in tests/fingerprint/test_*.mjs; do
            if grep -q 'firefox-src' "$f"; then
              echo "Source assertions run after patching in both Gecko build jobs: $f"
              continue
            fi
            node --test "$f"
          done

      # test_probe_js_spoofers_scoring.py is a main()-style script, not a
      # pytest module — it has real checks but no test_* functions, so pytest
      # collects nothing from it and exits clean. Run it the way its own
      # docstring documents (exit 0 = pass) instead of listing it under pytest,
      # where it would have been a green step that checked nothing.
      #
      # test_math_constants and test_sec_ch_ua look pure but drive a real
      # browser and merely SKIP without CLOAKFOX_BIN; they run in the
      # fingerprint-tests jobs, where a binary exists.
      - name: Strict outcomes and pinned library audit contract tests
        run: |
          python3 -m unittest discover -s tests/fingerprint -p test_probe_outcome_policy.py -v
          python3 -m unittest discover -s tests/fingerprint -p test_library_audit_contract.py -v
          python3 -m pytest --noconftest -q tests/fingerprint/test_library_fixture_safety.py

      - name: Fingerprint regression self-tests
        run: |
          set -euo pipefail
          python tests/fingerprint/test_probe_js_spoofers_scoring.py
          python tests/fingerprint/test_webgl_async_readback.py
          python tests/fingerprint/test_canvas_extraction_policy.py
          python tests/fingerprint/test_cpp_first_worker_cache.py

      - name: Release, blocker and native network policy tests
        run: |
          python -m unittest discover -s tests/release -p 'test_*.py'
          python -m unittest discover -s tests/blocker -p 'test_*.py'
          python -m unittest discover -s tests/network -p 'test_*.py'

  dual-engine-tests:
    needs: [build-macos, chromium]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: |
          python3 -m pip install selenium
          brew install geckodriver
      - uses: actions/download-artifact@v4
        with:
          name: cloakfox-macos-arm64
          path: artifacts/gecko
      - uses: actions/download-artifact@v4
        with:
          name: chromium-macos-arm64-test-apps
          path: artifacts/chromium
      - uses: actions/download-artifact@v4
        with:
          name: chromium-source-evidence
          path: evidence/source
      - name: Verify and extract same-commit browsers
        run: |
          mkdir -p apps evidence/coexistence
          python3 scripts/ci/verify_chromium_artifact.py --archive artifacts/chromium/chromium-apps.tar.gz --evidence evidence/source --destination apps
          hdiutil attach artifacts/gecko/Cloakfox-macos-arm64.dmg -mountpoint /tmp/coexist-gecko -nobrowse -readonly
          cp -R /tmp/coexist-gecko/Cloakfox.app apps/
          hdiutil detach /tmp/coexist-gecko
      - name: Concurrent Gecko 158 and Chromium persona and storage checks
        run: |
          python3 tests/engines/probe_dual_engine_coexistence.py \
            --gecko-binary "$PWD/apps/Cloakfox.app/Contents/MacOS/cloakfox" \
            --chromium-binary "$PWD/apps/patched-client/Release/CloakfoxChromium.app/Contents/MacOS/CloakfoxChromium" \
            --require-persona-config --require-pixel-privacy \
            --report evidence/coexistence/dual-engine.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-engine-runtime-evidence
          path: evidence/coexistence/
          if-no-files-found: error

  release:
    # Gates on the probe suites, not just the builds. A build only proves the
    # thing compiles and packages; the probes are what verify the browser
    # actually spoofs. Shipping a tag with red probes means shipping silently
    # broken fingerprint protection, which is the whole product.
    #
    # This is not hypothetical caution: build-linux was green for months while
    # uploading no artifact at all (a *.tar.bz2 glob against a .tar.xz file),
    # so "the build job passed" has already proven to be a weak release signal
    # here.
    needs: [build-macos, build-linux, fingerprint-tests, fingerprint-tests-linux, unit-tests, chromium, dual-engine-tests]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate upstream security freshness
        run: python3 scripts/release_security.py

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cloakfox-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
