name: Build Cloakfox

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build-macos:
    runs-on: macos-26
    env:
      SCCACHE_GHA_ENABLED: "true"
      BUILD_TARGET: macos,arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | bash -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          brew install aria2 nasm lld create-dmg
          cargo install cbindgen --version 0.29.2 --locked
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.9

      - name: Prioritize action's sccache
        run: echo "$(dirname $SCCACHE_PATH)" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build extension
        run: make extension

      - name: Generate Assets.car
        run: bash scripts/generate-assets-car.sh

      - name: Fetch and setup
        run: |
          make fetch
          make setup-minimal

      - name: Patch and configure
        run: |
          make dir
          python3 scripts/fix-mach-logging.py firefox-src
          echo "ac_add_options --with-ccache=$SCCACHE_PATH" >> firefox-src/mozconfig

      - name: Build
        env:
          # Route rustc through sccache (mk_add_options in mozconfig
          # didn't propagate). Step-level env reaches mach/cargo/rustc.
          RUSTC_WRAPPER: ${{ env.SCCACHE_PATH }}
          SCCACHE_GHA_ENABLED: "true"
          # Prevent the sccache daemon from idling out on macOS. On
          # recent runs the daemon shut down mid-build with
          # 'server looks like it shut down unexpectedly, compiling
          # locally instead' — after which every compile bypasses
          # the cache. SCCACHE_IDLE_TIMEOUT=0 disables the 600s-default
          # idle timer. Also enable error logging so the next crash
          # (if any) is diagnosable.
          SCCACHE_IDLE_TIMEOUT: "0"
          SCCACHE_ERROR_LOG: /tmp/sccache.log
          SCCACHE_LOG: warn
        run: make build

      - name: Dump sccache error log
        if: always()
        run: cat /tmp/sccache.log || true

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Verify
        run: |
          ls -la firefox-src/obj-*/dist/bin/cloakfox* || true
          grep "setCanvasSeed" firefox-src/dom/webidl/Window.webidl && echo "C++ API: FOUND" || echo "C++ API: NOT FOUND"

      - name: Package
        run: |
          cd firefox-src && ./mach package
          # Extract app from mach package DMG
          DMG_PATH=$(find obj-*/dist -name "*.dmg" -maxdepth 1 | head -1)
          hdiutil attach "$DMG_PATH" -mountpoint /tmp/mach-dmg -nobrowse
          # Copy app, strip extended attributes, and ad-hoc codesign
          mkdir -p /tmp/dmg-staging
          cp -R /tmp/mach-dmg/Cloakfox.app /tmp/dmg-staging/
          xattr -cr /tmp/dmg-staging/Cloakfox.app
          codesign --force --deep --sign - /tmp/dmg-staging/Cloakfox.app
          hdiutil detach /tmp/mach-dmg
          # Create branded DMG with background, icon positioning, and Applications shortcut
          mkdir -p ../dist
          create-dmg \
            --volname "Cloakfox" \
            --volicon "../additions/browser/branding/cloakfox/firefox.icns" \
            --background "../additions/browser/branding/cloakfox/background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --text-size 12 \
            --icon "Cloakfox.app" 175 200 \
            --app-drop-link 485 200 \
            --hide-extension "Cloakfox.app" \
            --no-internet-enable \
            --format UDZO \
            ../dist/Cloakfox-macos-arm64.dmg \
            /tmp/dmg-staging

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloakfox-macos-arm64
          path: dist/Cloakfox-macos-arm64.dmg

  build-linux:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      BUILD_TARGET: linux,x86_64

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up LLVM 18
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | bash -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools p7zip-full aria2 nasm \
            libasound2-dev libgtk-3-dev libdbus-glib-1-dev libpulse-dev \
            libx11-xcb-dev libxt-dev libxrandr-dev libxcomposite-dev libxdamage-dev \
            libclang-dev
          cargo install cbindgen --version 0.29.2 --locked

      - name: Set up git identity
        run: |
          git config --global user.email "ci@cloakfox"
          git config --global user.name "Cloakfox CI"

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@v0.0.9

      - name: Prioritize action's sccache
        run: echo "$(dirname $SCCACHE_PATH)" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build extension
        run: make extension

      - name: Fetch and setup
        run: |
          make fetch
          make setup-minimal

      - name: Patch and configure
        run: |
          make dir
          python3 scripts/fix-mach-logging.py firefox-src
          echo "ac_add_options --with-ccache=$SCCACHE_PATH" >> firefox-src/mozconfig

      - name: Create swap space
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build
        env:
          # Route rustc through sccache (mk_add_options in mozconfig
          # didn't propagate). Step-level env reaches mach/cargo/rustc.
          RUSTC_WRAPPER: ${{ env.SCCACHE_PATH }}
          SCCACHE_GHA_ENABLED: "true"
          # Prevent the sccache daemon from idling out on macOS. On
          # recent runs the daemon shut down mid-build with
          # 'server looks like it shut down unexpectedly, compiling
          # locally instead' — after which every compile bypasses
          # the cache. SCCACHE_IDLE_TIMEOUT=0 disables the 600s-default
          # idle timer. Also enable error logging so the next crash
          # (if any) is diagnosable.
          SCCACHE_IDLE_TIMEOUT: "0"
          SCCACHE_ERROR_LOG: /tmp/sccache.log
          SCCACHE_LOG: warn
        run: make build

      - name: Dump sccache error log
        if: always()
        run: cat /tmp/sccache.log || true

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Verify
        run: |
          ls -la firefox-src/obj-*/dist/bin/cloakfox* || true
          grep "setCanvasSeed" firefox-src/dom/webidl/Window.webidl && echo "C++ API: FOUND" || echo "C++ API: NOT FOUND"

      - name: Package
        run: cd firefox-src && ./mach package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloakfox-linux-x86_64
          # mach package produces .tar.xz on Firefox 146; the old *.tar.bz2 glob
          # matched nothing, so this artifact was NEVER uploaded — the step
          # logged "No files were found" and still reported success. Nothing
          # consumed it until the Linux probe job, which is what exposed it.
          path: firefox-src/obj-*/dist/*.tar.xz
          # Never silently upload nothing again.
          if-no-files-found: error

  # Runs the selenium fingerprint probe suite against the packaged macOS build.
  # Without this nothing exercises tests/fingerprint/ automatically, and the
  # regressions it guards are SILENT by nature — a dead cloak_cfg key, an
  # unseeded jitter or a mismatched key name changes no visible behaviour, so a
  # human would not notice one. Non-blocking for releases (continue-on-error)
  # because a probe needs a real browser launch and can be flaky on CI runners;
  # the summary still shows the table.
  fingerprint-tests:
    needs: build-macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install selenium + geckodriver
        run: |
          python -m pip install --upgrade pip
          pip install selenium
          brew install geckodriver

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: cloakfox-macos-arm64
          path: artifact

      - name: Extract app from DMG
        run: |
          set -euo pipefail
          DMG=$(find artifact -name "*.dmg" | head -1)
          echo "DMG: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/cfx-dmg -nobrowse -readonly
          mkdir -p /tmp/cfx-app
          cp -R /tmp/cfx-dmg/Cloakfox.app /tmp/cfx-app/
          hdiutil detach /tmp/cfx-dmg
          xattr -cr /tmp/cfx-app/Cloakfox.app || true
          ls -la /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox

      - name: Run fingerprint probe suite
        id: probes
        continue-on-error: true
        env:
          CLOAKFOX_BIN: /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox
        run: |
          set -o pipefail
          python tests/fingerprint/run_all.py 2>&1 | tee /tmp/probe-output.txt

      - name: Browser-dependent unit tests
        continue-on-error: true
        env:
          CLOAKFOX_BIN: /tmp/cfx-app/Cloakfox.app/Contents/MacOS/cloakfox
        run: |
          set -euo pipefail
          # These pytest files need a built binary and ran in NO job before —
          # run_all.py only globs probe_*.py. See the unit-tests job for why
          # --noconftest is needed.
          python -m pip install -q pytest
          python -m pytest -q --noconftest \
            tests/fingerprint/test_math_constants.py \
            tests/fingerprint/test_sec_ch_ua.py

      - name: Summarise results
        if: always()
        run: |
          {
            echo "## Fingerprint probe suite"
            echo ""
            echo '```'
            sed -n '/^====/,$p' /tmp/probe-output.txt 2>/dev/null | head -60 ||               echo "no probe output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-probe-output
          path: /tmp/probe-output.txt

      - name: Fail if probes regressed
        if: steps.probes.outcome == 'failure'
        run: |
          echo "One or more fingerprint probes failed — see the job summary."
          echo "Probes are the only guard against SILENT spoofing regressions."
          exit 1

  # Same probe suite, run against the LINUX build.
  #
  # Every fingerprint result in this project has been validated on macOS only —
  # one Apple Silicon dev box plus a macOS runner. That is a weak base for a
  # browser whose whole job is host-independence: several bugs found so far were
  # host-dependent, and personas sample an OS from the seed rather than locking
  # to the host, so a macOS host silently exercises the "persona matches host"
  # path a third of the time and the mismatch path the rest. On Linux the same
  # personas land differently, the font stack is different, and any assertion
  # that quietly assumed a Mac shows up here.
  #
  # continue-on-error on the suite step (not the job) so a Linux-only failure is
  # reported with full output rather than aborting mid-run.
  fingerprint-tests-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install selenium + geckodriver
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install selenium
          # Pinned URL rather than a package manager: apt has no geckodriver and
          # snap is unavailable on the runner. The probes pass the system-access
          # flag as a geckodriver service arg, which works on 0.36 and 0.37 alike,
          # so this version can move without breaking them.
          curl -sL -o /tmp/gd.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
          sudo tar -xzf /tmp/gd.tar.gz -C /usr/local/bin
          geckodriver --version

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libdbus-glib-1-2 libasound2t64 || \
            sudo apt-get install -y libgtk-3-0 libdbus-glib-1-2 libasound2

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: cloakfox-linux-x86_64
          path: artifact

      - name: Extract build
        run: |
          set -euo pipefail
          TARBALL=$(find artifact \( -name "*.tar.xz" -o -name "*.tar.bz2" \) | head -1)
          echo "tarball: $TARBALL"
          test -n "$TARBALL"
          mkdir -p /tmp/cfx-linux
          case "$TARBALL" in
            *.tar.xz)  tar -xJf "$TARBALL" -C /tmp/cfx-linux ;;
            *.tar.bz2) tar -xjf "$TARBALL" -C /tmp/cfx-linux ;;
          esac
          BIN=$(find /tmp/cfx-linux -maxdepth 3 -type f -name "cloakfox" | head -1)
          echo "binary: $BIN"
          test -n "$BIN"
          echo "CLOAKFOX_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Run fingerprint probe suite
        id: probes
        continue-on-error: true
        run: |
          set -o pipefail
          python tests/fingerprint/run_all.py 2>&1 | tee /tmp/probe-output-linux.txt

      - name: Browser-dependent unit tests
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q --noconftest \
            tests/fingerprint/test_math_constants.py \
            tests/fingerprint/test_sec_ch_ua.py

      - name: Summarise results
        if: always()
        run: |
          {
            echo "## Fingerprint probe suite (Linux)"
            echo ""
            echo '```'
            sed -n '/^====/,$p' /tmp/probe-output-linux.txt 2>/dev/null | head -60 || \
              echo "no probe output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-probe-output-linux
          path: /tmp/probe-output-linux.txt

      - name: Fail if probes regressed
        if: steps.probes.outcome == 'failure'
        run: |
          echo "One or more fingerprint probes failed on LINUX."
          echo "A Linux-only failure usually means an assertion assumed a macOS host."
          exit 1

  # Pure unit tests — no browser, no build. Runs in about a minute.
  #
  # These existed and were run by hand; nothing in CI executed them, so they
  # guarded nothing. They cover logic that is expensive to reach through a
  # built browser (matchMedia query evaluation, SeedSync font handling, Math
  # constant policy, Sec-CH-UA, probe scoring) and they catch regressions long
  # before a 2-hour build would.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Node unit tests
        run: |
          set -euo pipefail
          for f in tests/fingerprint/test_*.mjs; do
            echo "--- $f"
            node --test "$f"
          done

      # test_probe_js_spoofers_scoring.py is a main()-style script, not a
      # pytest module — it has real checks but no test_* functions, so pytest
      # collects nothing from it and exits clean. Run it the way its own
      # docstring documents (exit 0 = pass) instead of listing it under pytest,
      # where it would have been a green step that checked nothing.
      #
      # test_math_constants and test_sec_ch_ua look pure but drive a real
      # browser and merely SKIP without CLOAKFOX_BIN; they run in the
      # fingerprint-tests jobs, where a binary exists.
      - name: Probe scoring self-test
        run: |
          set -euo pipefail
          python tests/fingerprint/test_probe_js_spoofers_scoring.py

  release:
    # Gates on the probe suites, not just the builds. A build only proves the
    # thing compiles and packages; the probes are what verify the browser
    # actually spoofs. Shipping a tag with red probes means shipping silently
    # broken fingerprint protection, which is the whole product.
    #
    # This is not hypothetical caution: build-linux was green for months while
    # uploading no artifact at all (a *.tar.bz2 glob against a .tar.xz file),
    # so "the build job passed" has already proven to be a weak release signal
    # here.
    needs: [build-macos, build-linux, fingerprint-tests, fingerprint-tests-linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
