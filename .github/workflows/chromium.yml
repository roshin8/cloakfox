name: Chromium source and runtime

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    uses: ./.github/workflows/chromium-source-segment.yml
    with:
      segment: 1

  source2:
    needs: [source]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.source.outputs.complete != 'true' }}
    uses: ./.github/workflows/chromium-source-segment.yml
    with:
      segment: 2
      checkpoint: chromium-workspace-1

  source3:
    needs: [source, source2]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.source.outputs.complete != 'true' && needs.source2.result == 'success' && needs.source2.outputs.complete != 'true' }}
    uses: ./.github/workflows/chromium-source-segment.yml
    with:
      segment: 3
      checkpoint: chromium-workspace-2

  source4:
    needs: [source, source2, source3]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.source.outputs.complete != 'true' && needs.source2.result == 'success' && needs.source2.outputs.complete != 'true' && needs.source3.result == 'success' && needs.source3.outputs.complete != 'true' }}
    uses: ./.github/workflows/chromium-source-segment.yml
    with:
      segment: 4
      checkpoint: chromium-workspace-3

  source-complete:
    needs: [source, source2, source3, source4]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require actual completed framework and packaged clients
        env:
          COMPLETE: ${{ needs.source.outputs.complete == 'true' || needs.source2.outputs.complete == 'true' || needs.source3.outputs.complete == 'true' || needs.source4.outputs.complete == 'true' }}
          FAILURE: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          test "$COMPLETE" = "true"
          test "$FAILURE" = "false"

  runtime:
    needs: source-complete
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: chromium-macos-arm64-test-apps
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: chromium-source-evidence
          path: evidence/source
      - name: Verify same-commit artifact and embedded source framework
        run: |
          mkdir -p apps evidence/runtime
          python3 scripts/ci/verify_chromium_artifact.py --archive artifacts/chromium-apps.tar.gz --evidence evidence/source --destination apps
          echo "CLOAKFOX_CHROMIUM_BIN=$PWD/apps/patched-client/Release/CloakfoxChromium.app/Contents/MacOS/CloakfoxChromium" >> "$GITHUB_ENV"
          echo "CLOAKFOX_UNPATCHED_CHROMIUM_BIN=$PWD/apps/baseline-client/Release/CloakfoxChromium.app/Contents/MacOS/CloakfoxChromium" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned upstream fingerprint library fixtures
        run: python3 scripts/setup-fingerprint-libraries.py
      - name: Required CreepJS and FingerprintJS native Chromium audit
        timeout-minutes: 15
        run: python3 -u tests/engines/probe_fingerprint_libraries.py --binary "$CLOAKFOX_CHROMIUM_BIN" --report-dir evidence/runtime/library-audit
      - name: Install owned transport probe dependencies
        run: python3 -m pip install -r tests/network/requirements-wire.txt
      - name: Require actual Metal execution
        run: |
          python3 scripts/ci/runner_probe.py --output evidence/runtime/runner.json
          python3 -c 'import json; assert json.load(open("evidence/runtime/runner.json"))["metalAvailable"], "Metal compute unavailable"'
      - name: Native engine and privacy tests with unpatched control
        run: |
          set -o pipefail
          python3 scripts/ci/run_engine_tests.py 2>&1 | tee evidence/runtime/engine-tests.log
      - name: Sandbox and storage isolation
        run: python3 tests/engines/probe_cef_isolation.py --binary "$CLOAKFOX_CHROMIUM_BIN" --report evidence/runtime/isolation.json
      - name: Owned TCP and QUIC transport and certificate rejection
        run: python3 tests/engines/probe_cef_transport.py --binary "$CLOAKFOX_CHROMIUM_BIN" --report evidence/runtime/transport.json
      - name: Preserve actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-runtime-evidence
          path: evidence/runtime/
          if-no-files-found: error
          retention-days: 14
