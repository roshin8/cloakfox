name: Chromium client with versioned SDK
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  matching-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the client under review to match the SDK client pin
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.ci.sdk_client import verify_caller
          verify_caller(Path.cwd(),json.load(open('engines/chromium/sdk-lock.json')))
          PY
  client:
    needs: matching-client
    uses: ./.github/workflows/chromium-sdk-validation.yml
