name: Browser build runner survey

on:
  workflow_dispatch:
    inputs:
      chromium_sdk_validate:
        description: Build matching pinned client and run required runtime gates from completed SDK
        type: boolean
        default: false
      checkpoint_download_verify_only:
        description: Verify the complete saved checkpoint 15 download without compilation
        type: boolean
        default: false
      module_cache_verify_only:
        description: Verify module cache hits and source/SDK/header invalidation with pinned Clang
        type: boolean
        default: false
      cache_audit_only:
        description: Read the saved compiler-cache counters without compiling
        type: boolean
        default: false
      checkout_preflight_only:
        description: Verify the exact checkpoint-4 recipe checkout without compiling
        type: boolean
        default: false
      chromium_resume_run:
        description: Continue a terminal trusted Chromium checkpoint run; zero selects an exact-input cache automatically
        type: string
        default: '0'
      checkpoint_roundtrip:
        description: Verify native checkpoint save and restore without compiling
        type: boolean
        default: false
      xcrun_verify_fixed:
        description: Verify full source setup and host identity without Chromium compilation
        type: boolean
        default: false
      xcrun_setup_diagnostic:
        description: Compare full setup with and without changes inside selected Xcode
        type: boolean
        default: false
      metal_prerequisites_only:
        description: Verify Metal installation and offline shader compilation without building Chromium
        type: boolean
        default: false
      chromium_intel_build:
        description: Build the ARM64 Chromium SDK on a standard higher-memory Intel Mac
        type: boolean
        default: false
  push:
    branches: [codex/firefox-158-port]
    paths:
      - .github/workflows/runner-survey.yml
      - scripts/ci/runner_probe.py
      - tests/ci/test_runner_probe.py

permissions:
  contents: read

jobs:
  chromium-sdk-validation:
    if: ${{ inputs.chromium_sdk_validate }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/chromium-sdk-validation.yml

  survey:
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && !inputs.module_cache_verify_only && !inputs.cache_audit_only && !inputs.checkout_preflight_only && !inputs.chromium_intel_build && !inputs.metal_prerequisites_only && !inputs.xcrun_setup_diagnostic && !inputs.xcrun_verify_fixed && !inputs.checkpoint_roundtrip }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test capability evaluator
        run: python3 -m unittest discover -s tests/ci -v
      - name: Measure storage, Xcode and actual Metal execution
        run: python3 scripts/ci/runner_probe.py --output before/runner-capabilities.json
      - name: Reclaim unused Xcode installations on the disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          active="$(dirname "$(dirname "$(xcode-select -p)")")"
          case "$active" in /Applications/Xcode*.app) ;; *) exit 1 ;; esac
          for app in /Applications/Xcode*.app; do
            test -L "$app" && continue
            test "$app" -ef "$active" && continue
            sudo rm -rf -- "$app"
          done
      - name: Measure capacity after cleanup
        run: python3 scripts/ci/runner_probe.py --output after/runner-capabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-capabilities-${{ matrix.runner }}
          path: |
            before/runner-capabilities.json
            after/runner-capabilities.json
          if-no-files-found: error

  chromium-intel-build:
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && !inputs.module_cache_verify_only && !inputs.cache_audit_only && !inputs.checkout_preflight_only && inputs.chromium_intel_build && !inputs.metal_prerequisites_only && !inputs.xcrun_setup_diagnostic && !inputs.xcrun_verify_fixed && !inputs.checkpoint_roundtrip }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/chromium-engine.yml
    with:
      resume-run: ${{ inputs.chromium_resume_run }}

  metal-prerequisites:
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && !inputs.module_cache_verify_only && !inputs.cache_audit_only && !inputs.checkout_preflight_only && inputs.metal_prerequisites_only && !inputs.xcrun_setup_diagnostic && !inputs.xcrun_verify_fixed && !inputs.checkpoint_roundtrip }}
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: brew install cmake ninja ccache
      - name: Install separate Metal component
        timeout-minutes: 20
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Compile and link ARM64 shader and check build utilities
        timeout-minutes: 5
        run: python3 scripts/ci/metal_toolchain.py --directory "$RUNNER_TEMP/metal-preflight"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-prerequisites
          path: ${{ runner.temp }}/metal-preflight/
          if-no-files-found: warn

  xcrun-setup-diagnostic:
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && !inputs.module_cache_verify_only && !inputs.cache_audit_only && !inputs.checkout_preflight_only && inputs.xcrun_setup_diagnostic && !inputs.xcrun_verify_fixed && !inputs.checkpoint_roundtrip }}
    strategy:
      fail-fast: false
      matrix:
        cleanup: [legacy, preserve-active]
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Validate CI helpers as in source workflow
        run: python3 -m unittest discover -s tests/ci -v
      - name: Run source workflow capacity setup
        env:
          CLEANUP: ${{ matrix.cleanup }}
        run: |
          args=()
          if [[ "$CLEANUP" == preserve-active ]]; then args+=(--preserve-active-xcode); fi
          python3 scripts/ci/prepare_macos.py --output "$RUNNER_TEMP/capacity.json" "${args[@]}"
      - name: Install and snapshot same source build tools
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          brew install cmake ninja ccache
          ccache --max-size 5G
          python3 scripts/ci/chromium_host_tools.py snapshot --directory "$RUNNER_TEMP/host-tools"
      - name: Install separate Metal component
        timeout-minutes: 20
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Trace identical shader and SDK discovery commands
        timeout-minutes: 5
        run: python3 -u scripts/ci/xcrun_diagnostic.py --directory "$RUNNER_TEMP/xcrun-diagnostic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcrun-setup-${{ matrix.cleanup }}
          path: |
            ${{ runner.temp }}/capacity.json
            ${{ runner.temp }}/xcrun-diagnostic/
          if-no-files-found: warn

  xcrun-fixed-full-setup:
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && !inputs.module_cache_verify_only && !inputs.cache_audit_only && !inputs.checkout_preflight_only && inputs.xcrun_verify_fixed && !inputs.checkpoint_roundtrip }}
    runs-on: macos-26-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Require the higher-memory standard Intel build host
        run: |
          python3 - <<'PYCODE'
          import platform, subprocess
          memory = int(subprocess.check_output(['sysctl', '-n', 'hw.memsize'], text=True))
          assert platform.machine() == 'x86_64', 'Chromium source compilation requires the selected Intel host'
          assert memory >= 12 * 1024**3, 'Chromium source compilation requires at least 12 GiB host RAM'
          print(f'Intel build host memory: {memory / 1024**3:.1f} GiB; target remains ARM64')
          PYCODE
      - name: Compute committed engine input identity
        id: key
        run: python3 scripts/ci/engine_artifact.py key --kind chromium
      - name: Validate CI helpers
        run: python3 -m unittest discover -s tests/ci -v
      - name: Verify selected Xcode signature before cleanup
        timeout-minutes: 5
        run: |
          developer="$(xcode-select -p)"
          codesign --verify --strict --verbose=2 "${developer%/Contents/Developer}" > "$RUNNER_TEMP/xcode-seal-before.txt" 2>&1
          python3 - <<'PYCODE'
          import plistlib, subprocess, os, json
          from pathlib import Path
          developer=Path(subprocess.check_output(['xcode-select','-p'],text=True).strip())
          seal=plistlib.loads((developer.parents[1]/'Contents/_CodeSignature/CodeResources').read_bytes())
          entries=set(seal.get('files',{}))|set(seal.get('files2',{}))
          platforms=[p for p in entries if p.startswith('Developer/Platforms/') and not p.startswith('Developer/Platforms/MacOSX.platform')]
          Path(os.environ['RUNNER_TEMP'],'xcode-sealed-platforms.json').write_text(json.dumps({'sealedNonMacPlatformEntries':len(platforms),'examples':sorted(platforms)[:20]},indent=2)+'\n')
          PYCODE
      - name: Reclaim hosted Mac space and require full build capacity
        run: python3 scripts/ci/prepare_macos.py --preserve-active-xcode --output "$RUNNER_TEMP/capacity.json"
      - name: Publish capacity assessment before the long build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-capacity-1
          path: ${{ runner.temp }}/capacity.json
          if-no-files-found: error
          retention-days: 14
      - name: Install build tools
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          brew install cmake ninja ccache
          ccache --max-size 5G
      - name: Snapshot exact same-run Homebrew build tools
        run: python3 scripts/ci/chromium_host_tools.py snapshot --directory "$RUNNER_TEMP/host-tools"
      - name: Publish immutable same-run Homebrew build tools
        uses: actions/upload-artifact@v4
        with:
          name: chromium-host-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-tools/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
      - name: Install the separate Xcode Metal toolchain on every segment
        timeout-minutes: 20
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Verify offline ARM64 Metal shader compilation and linking
        timeout-minutes: 5
        run: python3 scripts/ci/metal_toolchain.py --directory "$RUNNER_TEMP/metal-preflight"
      - name: Preserve toolchain preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-metal-preflight-1
          path: ${{ runner.temp }}/metal-preflight/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify selected Xcode signature after complete setup
        timeout-minutes: 5
        run: |
          developer="$(xcode-select -p)"
          codesign --verify --strict --verbose=2 "${developer%/Contents/Developer}" > "$RUNNER_TEMP/xcode-seal-after.txt" 2>&1
      - name: Verify full checkpoint host identity on the preserved installation
        timeout-minutes: 20
        run: |
          python3 -u - <<'PYCODE'
          import sys, subprocess, json, os
          from pathlib import Path
          sys.path.insert(0, 'scripts/ci')
          from chromium_host_identity import collect
          developer=subprocess.check_output(['xcode-select','-p'],text=True).strip()
          identity=collect(developer)
          Path(os.environ['RUNNER_TEMP'],'host-identity-preflight.json').write_text(json.dumps(identity,indent=2)+'\n')
          PYCODE
      - name: Preserve full setup verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcrun-fixed-full-setup
          path: |
            ${{ runner.temp }}/capacity.json
            ${{ runner.temp }}/metal-preflight/
            ${{ runner.temp }}/xcode-seal-*.txt
            ${{ runner.temp }}/xcode-sealed-platforms.json
            ${{ runner.temp }}/host-identity-preflight.json
          if-no-files-found: warn

  checkpoint-roundtrip:
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && !inputs.module_cache_verify_only && !inputs.cache_audit_only && !inputs.checkout_preflight_only && inputs.checkpoint_roundtrip }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/checkpoint-roundtrip.yml

  checkout-preflight:
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && !inputs.module_cache_verify_only && !inputs.cache_audit_only && inputs.checkout_preflight_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/chromium-checkout-preflight.yml
    with:
      source-sha: 4f155411db66d1934e6926c4bf4c93cfb6561838
      source-key: cc270ce4c2790dc4d2fb295e7721c23321cb3acc4aefa3f934b846eda5d08999

  compiler-cache-audit:
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && !inputs.module_cache_verify_only && inputs.cache_audit_only }}
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - name: Install the cache reader
        run: |
          brew install ccache
          ccache --version
      - name: Restore the exact immutable segment-15 compiler-cache snapshot
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: chromium-ccache-X64-cc270ce4c2790dc4d2fb295e7721c23321cb3acc4aefa3f934b846eda5d08999-39491462098-1-15
          fail-on-cache-miss: true
      - name: Read detailed miss and rejection counters
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          test '${{ steps.cache.outputs.cache-hit }}' = true
          mkdir -p "$RUNNER_TEMP/cache-audit-evidence"
          ccache --show-stats --verbose > "$RUNNER_TEMP/cache-audit-evidence/stats-verbose.txt"
          ccache --print-stats > "$RUNNER_TEMP/cache-audit-evidence/stats-machine.txt"
          ccache --version > "$RUNNER_TEMP/cache-audit-evidence/version.txt"
          cat "$RUNNER_TEMP/cache-audit-evidence/stats-verbose.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-cache-audit-segment15
          path: ${{ runner.temp }}/cache-audit-evidence/
          if-no-files-found: warn
          retention-days: 7

  module-cache-verification:
    permissions:
      contents: read
      actions: read
    if: ${{ !inputs.chromium_sdk_validate && !inputs.checkpoint_download_verify_only && inputs.module_cache_verify_only }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install cache tool and fetch exact Chromium Intel-host compiler
        run: |
          brew install ccache
          python3 tests/ci/fetch_benchmark_clang.py --host-architecture x86_64 --destination "$RUNNER_TEMP/module-cache-check/clang"
      - name: Retrieve original checkpoint identity evidence only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '39491462098'
          artifact-ids: '12473887934'
          merge-multiple: true
          path: ${{ runner.temp }}/cache-source-evidence
      - name: Verify ARM64 module object hits and dependency invalidation
        run: |
          python3 tests/ci/check_chromium_module_cache.py --root "$RUNNER_TEMP/module-cache-check/fixture" --clang "$RUNNER_TEMP/module-cache-check/clang/bin/clang++" --ccache "$(command -v ccache)" --receipt "$RUNNER_TEMP/cache-source-evidence/checkpoint-out/workspace.tar.json"
          cat "$RUNNER_TEMP/module-cache-check/fixture/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-module-cache-verification
          path: |
            ${{ runner.temp }}/module-cache-check/fixture/result.json
            ${{ runner.temp }}/module-cache-check/fixture/ccache-debug.log
            ${{ runner.temp }}/module-cache-check/fixture/debug/**/*.ccache-input-text
            ${{ runner.temp }}/module-cache-check/compiler-provenance.json
          if-no-files-found: warn
          retention-days: 7

  checkpoint-download-verification:
    if: ${{ inputs.checkpoint_download_verify_only }}
    runs-on: macos-26-intel
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original checkpoint 15 artifact without restoring or compiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/chromium_checkpoint_download.py --repository "$GITHUB_REPOSITORY" --run 39491462098 --artifact-id 12474745183 --name chromium-workspace-15 --source-sha 4f155411db66d1934e6926c4bf4c93cfb6561838 --destination "$RUNNER_TEMP/checkpoint-in" --report "$RUNNER_TEMP/checkpoint-download.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-checkpoint-download-verification
          path: ${{ runner.temp }}/checkpoint-download.json
          if-no-files-found: error
