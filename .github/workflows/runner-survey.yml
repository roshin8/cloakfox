name: Browser build runner survey

on:
  workflow_dispatch:
    inputs:
      chromium_intel_build:
        description: Build the ARM64 Chromium SDK on a standard higher-memory Intel Mac
        type: boolean
        default: false
  push:
    branches: [codex/firefox-158-port]
    paths:
      - .github/workflows/runner-survey.yml
      - scripts/ci/runner_probe.py
      - tests/ci/test_runner_probe.py

permissions:
  contents: read

jobs:
  survey:
    if: ${{ !inputs.chromium_intel_build }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test capability evaluator
        run: python3 -m unittest discover -s tests/ci -v
      - name: Measure storage, Xcode and actual Metal execution
        run: python3 scripts/ci/runner_probe.py --output before/runner-capabilities.json
      - name: Reclaim unused Xcode installations on the disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          active="$(dirname "$(dirname "$(xcode-select -p)")")"
          case "$active" in /Applications/Xcode*.app) ;; *) exit 1 ;; esac
          for app in /Applications/Xcode*.app; do
            test -L "$app" && continue
            test "$app" -ef "$active" && continue
            sudo rm -rf -- "$app"
          done
      - name: Measure capacity after cleanup
        run: python3 scripts/ci/runner_probe.py --output after/runner-capabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-capabilities-${{ matrix.runner }}
          path: |
            before/runner-capabilities.json
            after/runner-capabilities.json
          if-no-files-found: error

  chromium-intel-build:
    if: ${{ inputs.chromium_intel_build }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/chromium-engine.yml
