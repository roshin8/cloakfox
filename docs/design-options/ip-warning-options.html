<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloakfox · Warning design options</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f6;color:#243349;font:14px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--surface:#fff;--muted:#58697f;--line:#d6deea;--accent:#3867ae;--tint:#f5f7fb;--amber:#946000;--amberbg:#fff5d9}body.dark{background:#141a21;color:#e3eaf3;--surface:#202832;--muted:#acbacb;--line:#3b4858;--accent:#79cdbb;--tint:#19212a;--amber:#f1c568;--amberbg:#393021;color-scheme:dark}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface)}header strong{font-size:16px}header small{display:block;color:var(--muted)}.switches{display:flex;gap:8px;flex-wrap:wrap}button,select{border:1px solid var(--line);border-radius:6px;padding:9px 13px;background:var(--surface);color:inherit}.switches button.active{background:var(--accent);color:var(--surface)}body.dark .switches button.active{color:#14231e}nav{display:flex;justify-content:center;gap:8px;padding:22px;flex-wrap:wrap}nav button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);box-shadow:0 2px 6px #0001}main{padding:22px 24px 55px;min-height:650px}.concept{max-width:720px;margin:0 auto}.caption{display:flex;justify-content:space-between;gap:20px;margin:0 0 15px;color:var(--muted);font-size:12px}.card{background:var(--surface);border-radius:12px;box-shadow:0 12px 40px #14273c18;padding:32px}.brand{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:30px}.brand svg{width:18px;height:18px}svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.warning{color:var(--amber)}h1{font-size:28px;letter-spacing:-.7px;line-height:1.2;margin:16px 0 10px}p{margin:0 0 18px;color:var(--muted)}.destination{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-block:1px solid var(--line);margin:23px 0;font-size:13px}.destination span{color:var(--muted)}.connection{display:flex;align-items:center;justify-content:center;gap:18px;margin:26px 0}.badge{border:1px solid var(--line);border-radius:6px;padding:7px 12px;display:flex;align-items:center;gap:9px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:#6574cc}.dot.teal{background:#2c9a83}.ip{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;overflow-wrap:anywhere}.shared{text-align:center}.shared small{display:block;color:var(--muted);font-size:11px}.wire{height:1px;width:24px;background:var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}body.dark .primary{color:#14231e}.actions button:hover{filter:brightness(.95)}details{margin-top:20px;font-size:12px;color:var(--muted)}summary{cursor:pointer;padding:6px 0}details button{font-size:12px;margin:8px 8px 0 0}.disclaimer{font-size:11px;color:var(--muted);margin:22px 0 0;line-height:1.6}.status{padding:11px 13px;margin-top:16px;border-radius:6px;background:var(--amberbg);color:var(--amber);font-size:13px}.status:empty{display:none}.comparison{display:grid;grid-template-columns:1fr 1fr;margin:26px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}.column{padding:20px;background:var(--tint)}.column+ .column{border-left:1px solid var(--line)}.column .badge{border:0;padding:0;margin-bottom:17px}.column small{display:block;color:var(--muted);margin:5px 0;font-size:12px}.match{background:var(--amberbg);color:var(--amber);padding:9px 14px;font-size:12px;grid-column:1/-1;border-top:1px solid var(--line)}.minimal{max-width:800px;display:grid;grid-template-columns:76px 1fr;gap:24px;padding-top:75px}.minimal>svg{width:66px;height:66px;margin-top:6px}.minimal h1{margin-top:0;font-size:30px}.minimal .destination{max-width:520px}.lab{max-width:720px;margin:26px auto 0;padding:15px 0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.lab select{font-size:12px}button:disabled{opacity:.65;cursor:wait}@media(max-width:600px){header{align-items:flex-start;padding:16px}.card{padding:22px}.connection{gap:8px;flex-wrap:wrap}.wire{width:12px}.minimal{grid-template-columns:1fr;padding-top:15px;gap:12px}.comparison{grid-template-columns:1fr}.column+.column{border-left:0;border-top:1px solid var(--line)}h1{font-size:25px}.lab{flex-wrap:wrap}}
</style><header><div><strong>Cloakfox · Conflict warning</strong><small>Three visual options · sample data · no browser changes</small></div><div class="switches"><button id="theme">Dark theme</button></div></header><nav aria-label="Design options"><button data-option="1" aria-pressed="true">1 · Extension style</button><button data-option="2" aria-pressed="false">2 · Compare containers</button><button data-option="3" aria-pressed="false">3 · Browser warning</button></nav><main><div id="preview"></div><div class="lab"><span>Try the Recheck IP button with a sample outcome</span><select id="outcome" aria-label="Sample recheck outcome"><option value="conflict">Still shared</option><option value="changed">IP changed</option><option value="failed">Lookup failed</option></select></div></main><script>
const warning='<svg class="warning" viewBox="0 0 24 24" aria-hidden="true"><path d="m10.3 4-8 14a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0Z"/><path d="M12 9v5m0 3v.1"/></svg>';
const brand='<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-8 3v6c0 4 4 7 8 9 4-2 8-5 8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg>Cloakfox</div>';
const badge=(name,teal=false)=>'<span class="badge"><i class="dot '+(teal?'teal':'')+'"></i>'+name+'</span>';
const actions='<div class="actions"><button class="primary" id="recheck">Recheck IP</button><button id="continue">Continue once</button></div><div id="status" class="status" role="status"></div><details><summary>More options</summary><button class="allow">Always allow Test 2</button><button class="allow">Allow this IP address</button><button class="allow">Manage conflict rules</button></details>';
const note='<p class="disclaimer">The website may already have received the initial connection. This warning cannot undo it. Continue once allows browsing for 30 seconds.</p>';
const destination='<div class="destination"><span>Website you’re opening</span><strong>icanhazip.com</strong></div>';
let option=1;
function render(){const titles=['Extension style','Compare containers','Browser warning'];let body='';if(option===1)body='<div class="card">'+brand+warning+'<h1>Shared IP detected</h1><p>This website could link Test 2 with another container.</p><div class="connection">'+badge('Test 1')+'<span class="wire"></span><div class="shared"><span class="ip">203.0.113.24</span><small>Same public IP</small></div><span class="wire"></span>'+badge('Test 2',true)+'</div>'+destination+'<p>Switch your proxy or VPN, then recheck before continuing.</p>'+actions+note+'</div>';if(option===2)body='<div class="card">'+brand+'<h1>Two containers. One public IP.</h1><p>Test 2 matches an address already used by Test 1.</p><div class="comparison"><div class="column">'+badge('Test 1')+'<small>Previously observed</small><div class="ip">203.0.113.24</div><small>Last seen 2 minutes ago</small></div><div class="column">'+badge('Test 2',true)+'<small>You’re browsing here</small><div class="ip">203.0.113.24</div><small>Checked just now</small></div><div class="match">Matching IP: These sessions may be linked</div></div>'+destination+actions+note+'</div>';if(option===3)body='<div class="minimal">'+warning+'<div><h1>This container shares an IP</h1><p><strong>Test 2</strong> is using the same public IP as <strong>Test 1</strong>. To keep their network identities separate, change your proxy or VPN and check again.</p>'+destination+actions+'<details><summary>Connection details</summary><p>Shared IP: 203.0.113.24<br>Previously observed in Test 1, 2 minutes ago.<br>Current container: Test 2.</p></details>'+note+'</div></div>';document.getElementById('preview').innerHTML='<section class="concept"><div class="caption"><strong>'+titles[option-1]+'</strong><span>'+['Compact, familiar extension layout','Conflict explained side by side','Quiet, native browser treatment'][option-1]+'</span></div>'+body+'</section>';document.getElementById('recheck').onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Checking your route…';await new Promise(r=>setTimeout(r,700));if(!b.isConnected)return;b.disabled=false;b.textContent='Recheck IP';document.getElementById('status').textContent={conflict:'Still shared with Test 1. Change your route and try again.',changed:'New IP detected: 203.0.113.56. No matching container in this sample.',failed:'Couldn’t check your IP. Check your connection and try again.'}[document.getElementById('outcome').value]};document.getElementById('continue').onclick=()=>document.getElementById('status').textContent='Preview only: this would continue to icanhazip.com for 30 seconds.';document.querySelectorAll('.allow').forEach(b=>b.onclick=()=>document.getElementById('status').textContent='Preview only: '+b.textContent+'. No settings changed.');}
document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{option=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.getElementById('theme').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'Light theme':'Dark theme'};render();
</script></html>
